services:
  - type: web
    name: mezox-music-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: CLIENT_CALLBACK_SCHEME
        value: mezoxmusic
